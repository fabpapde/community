---
- name: Create Veeam USAPI REST role and user on ONTAP cluster
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - netapp.ontap

  vars:
    role_name: veeam-usapi-rest-role
    login_user_name: svc-veeam-ontap

    # One entry per required API endpoint, matching the access levels
    # from the source security login rest-role create commands.
    role_privileges:
      - path: /api/cluster
        access: readonly
      - path: /api/cluster/jobs
        access: readonly
      - path: /api/cluster/licensing/access-tokens
        access: read_create
      - path: /api/cluster/licensing/licenses
        access: readonly
      - path: /api/cluster/metrocluster
        access: readonly
      - path: /api/cluster/nodes
        access: readonly
      - path: /api/cluster/peers
        access: read_create
      - path: /api/network/ip/interfaces
        access: readonly
      - path: /api/protocols/nfs/export-policies
        access: all
      - path: /api/protocols/nfs/services
        access: readonly
      - path: /api/protocols/san/fcp/services
        access: readonly
      - path: /api/protocols/san/igroups
        access: all
      - path: /api/protocols/san/iscsi/services
        access: readonly
      - path: /api/protocols/san/lun-maps
        access: all
      - path: /api/snapmirror/relationships
        access: all
      - path: /api/storage/aggregates
        access: readonly
      - path: /api/storage/luns
        access: all
      - path: /api/storage/qtrees
        access: all
      - path: /api/storage/snaplock/compliance-clocks
        access: readonly
      - path: /api/storage/volumes
        access: all
      - path: /api/svm/svms
        access: readonly

  vars_prompt:
    - name: netapp_password
      prompt: "ONTAP admin password (see --limit target for which cluster)"
      private: true

    - name: new_user_password
      prompt: "Password for the new ONTAP user 'svc-veeam-ontap'"
      private: true
      confirm: true

  tasks:
    - name: Ensure role {{ role_name }} exists with required privileges
      netapp.ontap.na_ontap_user_role:
        hostname: "{{ netapp_hostname | default(ansible_host) | default(inventory_hostname) }}"
        username: "{{ netapp_username | default(ansible_user) }}"
        password: "{{ netapp_password }}"
        https: true
        validate_certs: false
        state: present
        name: "{{ role_name }}"
        privileges: "{{ role_privileges }}"
      register: role_result

    - name: Show role result
      ansible.builtin.debug:
        msg: "Role {{ role_name }} changed: {{ role_result.changed }}"

    - name: Ensure login {{ login_user_name }} exists with role {{ role_name }}
      netapp.ontap.na_ontap_user:
        hostname: "{{ netapp_hostname | default(ansible_host) | default(inventory_hostname) }}"
        username: "{{ netapp_username | default(ansible_user) }}"
        password: "{{ netapp_password }}"
        https: true
        validate_certs: false
        state: present
        name: "{{ login_user_name }}"
        applications: http
        authentication_method: password
        set_password: "{{ new_user_password }}"
        role_name: "{{ role_name }}"
      no_log: true
      register: user_result

    # Equivalent of: security login rest-role show -role {{ role_name }}
    - name: Verify role {{ role_name }} exists (security login rest-role show)
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ netapp_hostname | default(ansible_host) | default(inventory_hostname) }}"
        username: "{{ netapp_username | default(ansible_user) }}"
        password: "{{ netapp_password }}"
        https: true
        validate_certs: false
        gather_subset:
          - security/roles
        parameters:
          name: "{{ role_name }}"
          fields: "privileges"
      register: verify_role_result

    - name: Show verified role privileges
      ansible.builtin.debug:
        var: verify_role_result.ontap_info
